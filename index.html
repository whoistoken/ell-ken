<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ell Ken AI Assistant</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="app">


<!-- SIDEBAR -->

<aside class="sidebar">

<div class="brand">

<div class="logo">
<i class="fa-solid fa-brain"></i>
</div>

<h2>Ell Ken AI</h2>

</div>



<button class="new-chat" id="newChat">

<i class="fa-solid fa-plus"></i>

Chat Baru

</button>



<div class="history-title">
Riwayat Chat
</div>


<div id="history" class="history">

</div>



<div class="sidebar-bottom">


<button id="settings">

<i class="fa-solid fa-gear"></i>

Pengaturan

</button>



<button id="clear">

<i class="fa-solid fa-trash"></i>

Hapus Chat

</button>


</div>


</aside>





<!-- AREA CHAT -->

<main class="main">



<header class="topbar">


<div>

<h1>
Ell Ken AI
</h1>


<p>
AI Assistant Futuristik
</p>


</div>



<div class="actions">


<button id="theme">

<i class="fa-solid fa-moon"></i>

</button>



<button id="profile">

<i class="fa-solid fa-user"></i>

</button>



</div>


</header>






<section id="chatBox" class="chat-box">



<div class="welcome">


<div class="ai-logo">

<i class="fa-solid fa-robot"></i>

</div>



<h2>
Halo 👋
</h2>



<p>
Saya adalah Ell Ken AI.
Ada yang ingin kamu tanyakan?
</p>



<div class="suggestions">


<button>
Jelaskan sesuatu
</button>


<button>
Buat ide kreatif
</button>


<button>
Bantu coding
</button>


</div>



</div>



</section>





<div id="typing" class="typing hidden">


<span></span>
<span></span>
<span></span>


</div>







<footer class="input-area">


<textarea

id="prompt"

placeholder="Tanyakan sesuatu ke Ell Ken AI..."

rows="1">

</textarea>




<button id="send">

<i class="fa-solid fa-paper-plane"></i>

</button>



</footer>





</main>



</div>





<script src="config.js"></script>

<script src="storage.js"></script>

<script src="api.js"></script>

<script src="script.js"></script>



</body>
</html>
